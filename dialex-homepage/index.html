<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Dialex Pad. Translate into the dialect people speak."
    />
    <title>Dialex</title>
    <link rel="stylesheet" href="styles.css" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23000000'/%3E%3Ccircle cx='16' cy='16' r='6' fill='%23D1D7DE'/%3E%3C/svg%3E"
    />
  </head>
  <body>
    <div class="grain" aria-hidden="true"></div>

    <header class="site-header">
      <a class="brand" href="#pad">Dialex</a>
    </header>

    <main id="pad" class="stage" aria-label="Pad">
      <div class="constellation" aria-hidden="true">
        <span class="c c1">Egyptian</span>
        <span class="c c2">Kansai</span>
        <span class="c c3">AAVE</span>
        <span class="c c4">Sicilian</span>
        <span class="c c5">Najdi</span>
        <span class="c c6">Levantine</span>
        <span class="c c7">Gulf</span>
        <span class="c c8">Maghrebi</span>
      </div>

      <section class="pad-shell">
        <div class="pane source-pane">
          <div class="pane-top">
            <div class="pane-label">Source</div>
            <button type="button" class="icon-btn mic-inline" id="pad-mic" aria-label="Voice input" title="Voice input">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                <path d="M12 14a3 3 0 0 0 3-3V7a3 3 0 1 0-6 0v4a3 3 0 0 0 3 3Z" stroke="currentColor" stroke-width="1.8"/>
                <path d="M5 11a7 7 0 0 0 14 0M12 18v3" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
              </svg>
            </button>
          </div>
          <textarea
            id="pad-input"
            placeholder="AI-detected language/dialect"
            aria-label="Source text"
          ></textarea>
          <div class="pad-actions">
            <button type="button" class="btn btn-primary" id="pad-translate">Translate</button>
            <div class="ghost-group">
              <button type="button" class="ghost-btn" id="pad-share">Share</button>
              <button type="button" class="ghost-btn" id="pad-clear">Clear</button>
            </div>
          </div>
          <div class="status-line" id="pad-status" role="status" aria-live="polite"></div>
        </div>

        <div class="pad-divider">
          <button type="button" class="dialect-bump" id="pad-dialect-bump" aria-label="Select a dialect">
            <span id="pad-dialect-label">Arabic · Modern Standard Arabic</span>
            <svg class="bump-icon" width="12" height="12" viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <path d="M6 9l6 6 6-6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </button>
        </div>

        <div class="pane output-pane" id="pad-output-pane">
          <div class="pane-label">Translation</div>
          <div class="output-text" id="pad-output" aria-live="polite"></div>
          <div class="transliteration" id="pad-translit" hidden></div>
        </div>
      </section>
    </main>

    <footer class="site-footer">
      Dialex · <a href="https://github.com/ramialdouri/DialectsOnX-Chrome">DialectsOnX for X</a>
    </footer>

    <script src="js/catalog.js"></script>
    <script src="js/sheet.js"></script>
    <script src="js/stt.js"></script>
    <script src="js/pad.js"></script>
    <script src="js/main.js"></script>
  </body>
</html>
