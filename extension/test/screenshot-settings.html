<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>DialectsOnX settings screenshot</title>
  <style>
    html, body { height: 100%; }
    body.dox-settings {
      margin: 0;
      background: var(--dox-ink, #000000);
      color: var(--dox-text, #F4F4F5);
      font-family: var(--dox-font);
    }
    #main { max-width: 720px; margin-inline: auto; padding: 20px 16px 48px; }
    .dox-settings-head {
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      text-align: center; gap: 10px; margin: 8px 0 24px;
    }
    .dox-settings-logo {
      background-color: var(--dox-text, #F4F4F5);
      -webkit-mask-image: url("../DialectsOnX-logo.png");
      mask-image: url("../DialectsOnX-logo.png");
      --dox-logo-cap: 40px;
    }
    h1 { font-size: 24px; font-weight: 700; margin: 0; line-height: 1.2; }
    .row, .toggle {
      display: flex; align-items: center; justify-content: space-between;
      gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--dox-line, #2C2C31);
      min-height: 44px;
    }
    .faw-label-wrap { display: inline-flex; align-items: center; gap: 4px; min-width: 0; }
    .dox-faw-howto {
      max-width: min(360px, calc(100vw - 32px)); padding: 10px 12px;
      background: var(--dox-elevated, #0E0E10); color: var(--dox-text, #F4F4F5);
      border: 1px solid var(--dox-line, #2C2C31); border-radius: 10px;
      font-size: 13px; line-height: 1.4;
    }
    button { font: inherit; border-radius: 8px; padding: 8px 10px;
      background: transparent; color: var(--dox-text, #F4F4F5);
      border: 1px solid var(--dox-line, #2C2C31); cursor: pointer; }
    a { color: var(--dox-muted, #8E8E93); }
    .hidden { display: none !important; }
    .dox-switch {
      appearance: none; -webkit-appearance: none;
      width: 40px; height: 24px; margin: 0;
      background: var(--dox-line, #2C2C31); border-radius: 999px;
      position: relative; cursor: pointer; border: 0; flex-shrink: 0;
    }
    .dox-switch::after {
      content: ""; position: absolute; width: 18px; height: 18px; border-radius: 50%;
      background: var(--dox-muted, #8E8E93); top: 3px; inset-inline-start: 3px;
    }
    .dox-switch:checked { background: rgba(244, 244, 245, 0.28); }
    .dox-switch:checked::after { background: var(--dox-text, #F4F4F5); inset-inline-start: 19px; }
  </style>
</head>
<body class="dox-settings">
  <div id="main">
    <div class="dox-settings-head">
      <span class="dox-wordmark dox-settings-logo" role="img" aria-label="DialectsOnX"></span>
      <h1 id="title"></h1>
    </div>
    <div class="row">
      <span id="sysLangLabel"></span>
      <button type="button" id="sysLangBtn"></button>
    </div>
    <label class="toggle"><span id="autoLabel"></span><input class="dox-switch" type="checkbox" id="autoTranslate" role="switch" /></label>
    <label class="toggle">
      <span class="faw-label-wrap">
        <span id="fawLabel"></span>
        <button type="button" class="dox-icon-btn" id="fawInfo"></button>
      </span>
      <input class="dox-switch" type="checkbox" id="fawEnabled" role="switch" />
    </label>
    <div id="fawHowto" class="dox-faw-howto" hidden></div>
    <label class="toggle">
      <span class="faw-label-wrap">
        <span id="newsLabel"></span>
        <button type="button" class="dox-icon-btn" id="newsInfo"></button>
      </span>
      <input class="dox-switch" type="checkbox" id="newsToMsa" role="switch" />
    </label>
    <div id="newsHowto" class="dox-faw-howto" hidden></div>
    <label class="toggle">
      <span class="faw-label-wrap">
        <span id="imeLabel"></span>
        <button type="button" class="dox-icon-btn" id="imeInfo"></button>
      </span>
      <input class="dox-switch" type="checkbox" id="imeEnabled" role="switch" />
    </label>
    <div id="imeHowto" class="dox-faw-howto" hidden></div>
    <div class="row">
      <span class="faw-label-wrap">
        <button type="button" id="clearCache"></button>
        <button type="button" class="dox-icon-btn" id="cacheInfo"></button>
      </span>
      <button type="button" id="clearRecents"></button>
    </div>
    <div id="cacheHowto" class="dox-faw-howto" hidden></div>
    <p><a id="padLink" href="https://www.dialex-app.com" target="_blank" rel="noopener"></a></p>
    <p id="about"></p>
  </div>
  <div id="sysView" class="dox-sys hidden">
    <div class="dox-sys-header">
      <button type="button" id="sysBack" class="dox-sys-back"></button>
      <h1 id="sysTitle" class="dox-sys-title"></h1>
    </div>
    <div class="dox-sys-card">
      <div class="dox-sys-search-row">
        <div class="dox-sys-search">
          <span class="dox-sys-search-icon"></span>
          <input id="sysSearch" />
          <button type="button" id="sysSearchClear" class="dox-sys-search-clear" hidden></button>
        </div>
      </div>
      <div id="sysList" class="dox-sys-list"></div>
    </div>
  </div>
  <script src="chrome-mock.js"></script>
  <script src="../theme.js"></script>
  <script src="../dialects.js"></script>
  <script src="../locale.js"></script>
  <script src="../prefs.js"></script>
  <script src="../api.js"></script>
  <script src="../sheet.js"></script>
  <script src="../faw.js"></script>
  <script src="../system-language.js"></script>
  <script src="../settings.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      document.body.dataset.newsLabel = document.getElementById("newsLabel").textContent;
      document.body.dataset.ready = "settings";
    });
  </script>
</body>
</html>
