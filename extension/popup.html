<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <style>
    body {
      width: 280px;
      margin: 0;
      padding: 20px 16px;
      background: #000;
      color: #e7e9ea;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      text-align: center;
    }
    .logo {
      display: block;
      width: 132px;
      height: auto;
      margin: 0 auto 6px auto;
    }
    .version {
      font-size: 12px;
      color: #71767b;
      margin-bottom: 14px;
    }
    p {
      font-size: 13px;
      color: #aab2b8;
      line-height: 1.5;
      margin: 0;
    }
    p b { color: #e7e9ea; }
  </style>
</head>
<body>
  <img class="logo" src="dialx_logo.png" alt="DialX" />
  <div class="version">v0.1</div>
  <p>Controls appear directly on X posts.<br>
     Click <b>Dialect Selector</b> on any post to change the dialect.</p>
</body>
</html>
