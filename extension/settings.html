<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>DialectsOnX Settings</title>
  <style>
    html, body { height: 100%; }
    body.dox-settings {
      margin: 0;
      background: var(--dox-ink, #000000);
      color: var(--dox-text, #F4F4F5);
      font-family: var(--dox-font);
    }
    #main {
      max-width: 720px; margin-inline: auto; padding: 20px 16px 48px;
    }
    .dox-settings-head {
      display: flex; align-items: center; gap: 12px;
      margin: 0 0 16px;
    }
    .dox-settings-logo {
      background-color: var(--dox-muted, #8E8E93);
      -webkit-mask-image: url("DialectsOnX-logo.png");
      mask-image: url("DialectsOnX-logo.png");
    }
    h1 { font-size: 20px; font-weight: 600; margin: 0; line-height: var(--dox-logo-cap, 32px); }
    h2 { font-size: 13px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase;
      color: var(--dox-muted, #8E8E93); margin: 20px 0 8px; }
    .row, .toggle {
      display: flex; align-items: center; justify-content: space-between;
      gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--dox-line, #2C2C31);
      min-height: 44px;
    }
    .faw-label-wrap {
      display: inline-flex; align-items: center; gap: 4px; min-width: 0;
    }
    .dox-faw-howto {
      max-width: min(360px, calc(100vw - 32px));
      padding: 10px 12px;
      background: var(--dox-elevated, #0E0E10);
      color: var(--dox-text, #F4F4F5);
      border: 1px solid var(--dox-line, #2C2C31);
      border-radius: 10px;
      font-size: 13px;
      line-height: 1.4;
      box-shadow: 0 8px 24px rgba(0,0,0,.4);
    }
    .dox-faw-howto:popover-open { margin: 0; }
    button, input[type="text"] {
      font: inherit; border-radius: 8px; padding: 8px 10px;
    }
    button {
      background: transparent; color: var(--dox-text, #F4F4F5);
      border: 1px solid var(--dox-line, #2C2C31); cursor: pointer;
    }
    button:hover { border-color: var(--dox-accent, #8A7C5C); background: var(--dox-accent-hover, rgba(138,124,92,.16)); }
    a { color: var(--dox-muted, #8E8E93); }
    a:hover { color: var(--dox-text, #F4F4F5); }
    .hint { color: var(--dox-muted, #8E8E93); font-size: 12px; margin: 0 0 12px; }
    .hidden { display: none !important; }
    .dox-switch {
      appearance: none; -webkit-appearance: none;
      width: 40px; height: 24px; margin: 0;
      background: var(--dox-line, #2C2C31);
      border-radius: 999px;
      position: relative;
      cursor: pointer;
      border: 0;
      flex-shrink: 0;
    }
    .dox-switch::after {
      content: "";
      position: absolute;
      width: 18px; height: 18px;
      border-radius: 50%;
      background: var(--dox-muted, #8E8E93);
      top: 3px;
      inset-inline-start: 3px;
      transition: inset-inline-start .15s ease, background .15s ease;
    }
    .dox-switch:checked { background: rgba(138, 124, 92, 0.35); }
    .dox-switch:checked::after {
      background: var(--dox-accent, #8A7C5C);
      inset-inline-start: 19px;
    }
    @media (prefers-reduced-motion: reduce) {
      .dox-switch::after { transition: none; }
    }
  </style>
  <script src="theme.js"></script>
</head>
<body class="dox-settings">
  <div id="main">
    <div class="dox-settings-head">
      <span class="dox-wordmark dox-settings-logo" role="img" aria-label="DialectsOnX"></span>
      <h1 id="title"></h1>
    </div>
    <div class="row">
      <span id="sysLangLabel"></span>
      <button type="button" id="sysLangBtn"></button>
    </div>
    <label class="toggle"><span id="autoLabel"></span><input class="dox-switch" type="checkbox" id="autoTranslate" role="switch" /></label>
    <label class="toggle">
      <span class="faw-label-wrap">
        <span id="fawLabel"></span>
        <button type="button" class="dox-icon-btn" id="fawInfo"></button>
      </span>
      <input class="dox-switch" type="checkbox" id="fawEnabled" role="switch" />
    </label>
    <div id="fawHowto" class="dox-faw-howto" hidden></div>
    <label class="toggle"><span id="newsLabel"></span><input class="dox-switch" type="checkbox" id="newsToMsa" role="switch" /></label>
    <label class="toggle"><span id="imeLabel"></span><input class="dox-switch" type="checkbox" id="imeEnabled" role="switch" /></label>
    <div class="row">
      <button type="button" id="clearCache"></button>
      <button type="button" id="clearRecents"></button>
    </div>
    <p class="hint" id="cacheHint"></p>
    <p><a id="padLink" href="https://www.dialex-app.com" target="_blank" rel="noopener"></a></p>
    <p id="about"></p>
  </div>
  <div id="sysView" class="dox-sys hidden">
    <div class="dox-sys-header">
      <button type="button" id="sysBack" class="dox-sys-back"></button>
      <h1 id="sysTitle" class="dox-sys-title"></h1>
    </div>
    <div class="dox-sys-card">
      <div class="dox-sys-search-row">
        <div class="dox-sys-search">
          <span class="dox-sys-search-icon"></span>
          <input id="sysSearch" />
          <button type="button" id="sysSearchClear" class="dox-sys-search-clear" hidden></button>
        </div>
      </div>
      <div id="sysList" class="dox-sys-list"></div>
    </div>
  </div>
  <script src="dialects.js"></script>
  <script src="locale.js"></script>
  <script src="prefs.js"></script>
  <script src="api.js"></script>
  <script src="sheet.js"></script>
  <script src="faw.js"></script>
  <script src="system-language.js"></script>
  <script src="settings.js"></script>
</body>
</html>
