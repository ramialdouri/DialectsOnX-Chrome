<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>DialectsOnX</title>
  <style>
    html, body { margin: 0; }
    body.dox-popup {
      width: 280px;
      box-sizing: border-box;
      padding: 10px 14px 12px;
      background: var(--dox-ink, #000000);
      color: var(--dox-text, #F4F4F5);
      font-family: var(--dox-font);
    }
    .dox-popup-head {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 28px;
      margin: 0 0 8px;
    }
    .dox-popup-logo {
      background-color: var(--dox-text, #F4F4F5);
      -webkit-mask-image: url("DialectsOnX-logo.png");
      mask-image: url("DialectsOnX-logo.png");
      --dox-logo-cap: 22px;
    }
    .dox-popup-head .dox-icon-btn {
      position: absolute;
      inset-inline-end: 0;
      top: 50%;
      transform: translateY(-50%);
      margin: 0;
    }
    .toggle {
      display: flex; align-items: center; justify-content: space-between;
      padding: 8px 0 12px;
      font-size: 13px; font-weight: 600;
    }
    .dox-switch {
      appearance: none; -webkit-appearance: none;
      width: 40px; height: 24px; margin: 0;
      background: var(--dox-line, #2C2C31);
      border-radius: 999px;
      position: relative;
      cursor: pointer;
      border: 0;
    }
    .dox-switch::after {
      content: "";
      position: absolute;
      width: 18px; height: 18px;
      border-radius: 50%;
      background: var(--dox-muted, #8E8E93);
      top: 3px;
      inset-inline-start: 3px;
      transition: inset-inline-start .15s ease, background .15s ease;
    }
    .dox-switch:checked { background: rgba(244, 244, 245, 0.28); }
    .dox-switch:checked::after {
      background: var(--dox-text, #F4F4F5);
      inset-inline-start: 19px;
    }
    #ime { width: 100%; box-sizing: border-box; margin-top: 4px; }
  </style>
</head>
<body class="dox-popup">
  <div class="dox-popup-head">
    <span class="dox-wordmark dox-popup-logo" role="img" aria-label="DialectsOnX"></span>
    <button type="button" class="dox-icon-btn" id="settings"></button>
  </div>
  <div class="toggle">
    <span id="onLabel"></span>
    <input class="dox-switch" type="checkbox" id="enabled" />
  </div>
  <button type="button" class="dox-outline-btn" id="ime"></button>
  <script src="theme.js"></script>
  <script src="dialects.js"></script>
  <script src="locale.js"></script>
  <script src="prefs.js"></script>
  <script src="popup.js"></script>
</body>
</html>
