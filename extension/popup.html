<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&display=swap" />
  <style>
    body {
      width: 320px;
      margin: 0;
      padding: 18px 16px;
      background: #000000;
      color: #f2f4f7;
      font-family: Manrope, system-ui, sans-serif;
      text-align: center;
    }
    .logo {
      display: block;
      width: 132px;
      height: auto;
      margin: 0 auto 6px auto;
    }
    .version {
      font-size: 12px;
      color: #9ba3ae;
      margin-bottom: 12px;
    }
    p.intro {
      font-size: 13px;
      color: #9ba3ae;
      line-height: 1.5;
      margin: 0 0 14px 0;
      text-align: left;
    }
    p.intro b { color: #f2f4f7; }

    .pad-link {
      display: block;
      padding: 10px 12px;
      border-radius: 999px;
      background: #f2f4f7;
      border: 1px solid #f2f4f7;
      color: #000;
      text-decoration: none;
      font-size: 13px;
      font-weight: 700;
    }
    .pad-link:hover { background: #ffffff; }
  </style>
</head>
<body>
  <img class="logo" src="DialectsOnX-logo.png" alt="DialectsOnX" />
  <div class="version">v0.2</div>
  <p class="intro">
    On X, open <b>Select dialect</b> on a post.
    On any site, focus a text field and tap <b>Translate</b>.
  </p>

  <a class="pad-link" href="https://dialex-app.com/#pad" target="_blank" rel="noopener noreferrer">
    Open Dialex Pad
  </a>
</body>
</html>
