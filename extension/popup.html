<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>DialectsOnX</title>
  <style>
    body {
      width: 280px;
      margin: 0;
      padding: 16px;
      background: #000;
      color: #e7e9ea;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    img.logo { display: block; width: 140px; height: auto; margin: 0 auto 6px; }
    .ver { text-align: center; color: #71767b; font-size: 12px; margin-bottom: 14px; }
    button, .row {
      width: 100%;
      box-sizing: border-box;
      margin: 6px 0;
    }
    button {
      background: #1d9bf0; color: #fff; border: 0; border-radius: 10px;
      padding: 10px 12px; font: 700 13px inherit; cursor: pointer;
    }
    button.secondary { background: #202327; border: 1px solid #2f3336; }
    .toggle {
      display: flex; align-items: center; justify-content: space-between;
      padding: 8px 0;
    }
  </style>
</head>
<body>
  <img class="logo" src="DialectsOnX-logo.png" alt="DialectsOnX" />
  <div class="ver" id="ver"></div>
  <div class="toggle">
    <span id="onLabel"></span>
    <input type="checkbox" id="enabled" />
  </div>
  <button type="button" class="secondary" id="ime"></button>
  <button type="button" id="settings"></button>
  <script src="dialects.js"></script>
  <script src="locale.js"></script>
  <script src="prefs.js"></script>
  <script src="popup.js"></script>
</body>
</html>
