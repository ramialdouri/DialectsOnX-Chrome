<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>DialectsOnX popup screenshot</title>
  <style>
    html, body { margin: 0; background: #000; }
    body.dox-popup {
      width: 280px;
      box-sizing: border-box;
      padding: 12px 14px 16px;
      background: var(--dox-ink, #000000);
      color: var(--dox-text, #F4F4F5);
      font-family: var(--dox-font);
    }
    .dox-popup-head {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    img.logo { display: block; width: 140px; height: auto; }
    .dox-popup-head .dox-icon-btn { margin-inline-start: auto; }
    .ver { color: var(--dox-muted, #8E8E93); font-size: 12px; margin: 4px 0 12px; }
    .toggle {
      display: flex; align-items: center; justify-content: space-between;
      padding: 8px 0 12px;
      font-size: 13px; font-weight: 600;
    }
    .dox-switch {
      appearance: none; -webkit-appearance: none;
      width: 40px; height: 24px; margin: 0;
      background: var(--dox-line, #2C2C31);
      border-radius: 999px;
      position: relative;
      cursor: pointer;
      border: 0;
    }
    .dox-switch::after {
      content: "";
      position: absolute;
      width: 18px; height: 18px;
      border-radius: 50%;
      background: var(--dox-muted, #8E8E93);
      top: 3px;
      inset-inline-start: 3px;
    }
    .dox-switch:checked { background: rgba(138, 124, 92, 0.35); }
    .dox-switch:checked::after {
      background: var(--dox-accent, #8A7C5C);
      inset-inline-start: 19px;
    }
    #ime { width: 100%; box-sizing: border-box; margin-top: 4px; }
  </style>
</head>
<body class="dox-popup">
  <div class="dox-popup-head">
    <img class="logo" src="../DialectsOnX-logo.png" alt="DialectsOnX" />
    <button type="button" class="dox-icon-btn" id="settings"></button>
  </div>
  <div class="ver" id="ver"></div>
  <div class="toggle">
    <span id="onLabel"></span>
    <input class="dox-switch" type="checkbox" id="enabled" />
  </div>
  <button type="button" class="dox-outline-btn" id="ime"></button>
  <script src="chrome-mock.js"></script>
  <script src="../theme.js"></script>
  <script src="../dialects.js"></script>
  <script src="../locale.js"></script>
  <script src="../prefs.js"></script>
  <script src="../popup.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      document.body.dataset.ready = "popup";
    });
  </script>
</body>
</html>
