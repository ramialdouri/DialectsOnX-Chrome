<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>DialectsOnX tweet fixture</title>
  <style>
    body { font-family: sans-serif; background: #000; color: #e7e9ea; padding: 24px; }
    article { max-width: 540px; border: 1px solid #2f3336; padding: 16px; border-radius: 12px; }
  </style>
</head>
<body>
  <p>Local tweet DOM fixture (no x.com login).</p>
  <article data-testid="tweet">
    <div data-testid="tweetText">
      Hello world
      <img alt="🔥" src="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///ywAAAAAAQABAAACAUwAOw==" />
      more text
      <br><br>
      • bullet one
      <br>
      • bullet two
      <span>Show more</span>
    </div>
  </article>
  <pre id="out"></pre>
  <script src="../dialects.js"></script>
  <script>
    function extractPostText(el) {
      if (!el) return "";
      const parts = [];
      const walk = (node) => {
        if (!node) return;
        if (node.nodeType === Node.TEXT_NODE) {
          parts.push(node.textContent || "");
          return;
        }
        if (node.nodeType !== Node.ELEMENT_NODE) return;
        const tag = node.tagName;
        if (tag === "BR") {
          parts.push("\n");
          return;
        }
        if (tag === "IMG" && node.alt) {
          parts.push(node.alt);
          return;
        }
        for (const child of node.childNodes) walk(child);
        if (node !== el && (tag === "DIV" || tag === "P" || tag === "LI" || tag === "BLOCKQUOTE")) {
          parts.push("\n");
        }
      };
      walk(el);
      return parts
        .join("")
        .replace(/[ \t\u00a0]+/g, " ")
        .replace(/ *\n */g, "\n")
        .replace(/\n{3,}/g, "\n\n")
        .replace(/\s*(show|see|read)\s+more\s*$/i, "")
        .trim();
    }
    const el = document.querySelector('[data-testid="tweetText"]');
    const text = extractPostText(el);
    document.getElementById("out").textContent = JSON.stringify({
      text,
      hasFire: text.includes("🔥"),
      hasBlank: text.includes("\n\n"),
      hasBullet: text.includes("•"),
      dialectCount: Dox.CATALOG.ids.length,
    }, null, 2);
  </script>
</body>
</html>
