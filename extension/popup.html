<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <style>
    body {
      width: 300px;
      margin: 0;
      padding: 20px 16px;
      background: #000;
      color: #e7e9ea;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      text-align: center;
    }
    .logo {
      display: block;
      width: 132px;
      height: auto;
      margin: 0 auto 6px auto;
    }
    .version {
      font-size: 12px;
      color: #71767b;
      margin-bottom: 14px;
    }
    p.intro {
      font-size: 13px;
      color: #aab2b8;
      line-height: 1.5;
      margin: 0 0 16px 0;
    }
    p.intro b { color: #e7e9ea; }

    .settings {
      text-align: left;
      border-top: 1px solid #2f3336;
      padding-top: 14px;
    }
    .settings h3 {
      margin: 0 0 10px 0;
      font-size: 13px;
      font-weight: 700;
      color: #e7e9ea;
    }
    label {
      display: block;
      font-size: 12px;
      color: #aab2b8;
      margin-bottom: 5px;
    }
    .row {
      display: flex;
      gap: 6px;
    }
    input[type="text"] {
      flex: 1;
      min-width: 0;
      background: #16181c;
      border: 1px solid #2f3336;
      border-radius: 8px;
      color: #e7e9ea;
      padding: 8px 10px;
      font-size: 12px;
      box-sizing: border-box;
    }
    input[type="text"]:focus {
      outline: none;
      border-color: #1d9bf0;
    }
    button#save {
      background: #1d9bf0;
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 8px 14px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
    }
    button#save:hover { background: #1a8cd8; }
    .footer-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 8px;
      min-height: 16px;
    }
    #status {
      font-size: 11px;
      color: #00ba7c;
      opacity: 0;
      transition: opacity 0.15s ease;
    }
    #status.show { opacity: 1; }
    #status.error { color: #f4212e; }
    a#reset {
      font-size: 11px;
      color: #1d9bf0;
      cursor: pointer;
      text-decoration: none;
    }
    a#reset:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <img class="logo" src="dialx_logo.png" alt="DialX" />
  <div class="version">v0.1</div>
  <p class="intro">Controls appear directly on X posts.<br>
     Click <b>Dialect Selector</b> on any post to change the dialect.</p>

  <div class="settings">
    <h3>Settings</h3>
    <label for="backendUrl">Backend URL</label>
    <div class="row">
      <input type="text" id="backendUrl" placeholder="https://dialx-backend.onrender.com" spellcheck="false" />
      <button id="save" type="button">Save</button>
    </div>
    <div class="footer-row">
      <span id="status"></span>
      <a id="reset">Use default</a>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
